<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Duvan Saldarriaga — Roylizzz">
  <!-- Adapted from Aurora Veil by beydemirfurkan/awesome-github-profile (CC0). -->
  <defs>
    <radialGradient id="sky" cx="0.5" cy="1" r="1.1">
      <stop offset="0" stop-color="#1d1238"/>
      <stop offset="0.52" stop-color="#0d0919"/>
      <stop offset="1" stop-color="#030208"/>
    </radialGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="0.85" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#d946ef" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.78"/>
      <stop offset="0.86" stop-color="#ec4899" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueviolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <filter id="flow1" x="-30%" y="-50%" width="160%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.022" numOctaves="3" seed="2" result="t1">
        <animate attributeName="baseFrequency" values="0.006 0.022;0.011 0.028;0.006 0.022" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="seed" from="0" to="40" dur="40s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t1" scale="90" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="flow2" x="-30%" y="-50%" width="160%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.026" numOctaves="2" seed="9" result="t2">
        <animate attributeName="baseFrequency" values="0.009 0.026;0.014 0.034;0.009 0.026" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="seed" from="0" to="30" dur="32s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t2" scale="70"/>
    </filter>
    <filter id="flow3" x="-30%" y="-50%" width="160%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.04" numOctaves="2" seed="17" result="t3">
        <animate attributeName="seed" from="0" to="50" dur="22s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t3" scale="48"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0.05 0"/>
    </filter>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080512"/>
      <stop offset="1" stop-color="#000002"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" filter="url(#grain)" opacity="0.34"/>

  <g fill="#ffffff">
    <circle cx="80" cy="42" r="0.8"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="78" r="1.1"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="34" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="98" r="0.9"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="402" cy="58" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="32" r="0.8"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="568" cy="82" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="642" cy="48" r="0.7"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="724" cy="106" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="802" cy="36" r="0.9"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="884" cy="74" r="0.8"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="962" cy="44" r="1.1"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="1042" cy="92" r="0.7"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1118" cy="56" r="1"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="22" r="0.8"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#flow1)" opacity="0.52"><rect x="-100" y="120" width="1400" height="120" fill="url(#blueviolet)"/></g>
  <g filter="url(#flow2)" opacity="0.84"><rect x="-100" y="80" width="1400" height="160" fill="url(#magenta)"/></g>
  <g filter="url(#flow3)" opacity="0.94"><rect x="-100" y="60" width="1400" height="180" fill="url(#violet)"/></g>
  <g opacity="0.16" filter="url(#flow2)" transform="translate(0,420) scale(1,-0.35)"><rect x="-100" y="80" width="1400" height="160" fill="url(#magenta)"/></g>

  <path d="M0,420 L0,300 L80,272 L150,288 L210,250 L280,280 L340,238 L420,272 L490,250 L580,290 L640,260 L720,295 L800,258 L880,288 L950,266 L1030,302 L1100,278 L1170,294 L1200,280 L1200,420 Z" fill="url(#mountain)"/>
  <path d="M0,300 L80,272 L150,288 L210,250 L280,280 L340,238 L420,272 L490,250 L580,290 L640,260 L720,295 L800,258 L880,288 L950,266 L1030,302 L1100,278 L1170,294 L1200,280" fill="none" stroke="#a78bfa" stroke-width="0.6" opacity="0.55"/>

  <g font-family="'Fraunces','Playfair Display',Georgia,serif">
    <text x="80" y="368" font-size="72" font-weight="500" font-style="italic" fill="#f5f3ff" filter="url(#glow)" letter-spacing="-1.5">Duvan Saldarriaga</text>
  </g>
  <g font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace">
    <text x="82" y="396" font-size="11" fill="#c4b5fd" letter-spacing="5" opacity="0.98">C# · .NET · BLAZOR · SQL · SOFTWARE DEVELOPER</text>
  </g>
  <text x="1120" y="396" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#a78bfa" opacity="0.72">@ROYLIZZZ</text>

  <g transform="translate(80,40)" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a1a1aa" letter-spacing="3">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#a78bfa" stroke-width="0.6"/>
    <text x="20" y="3">PROFILE · 2026</text>
  </g>
  <g transform="translate(1120,40)" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a1a1aa" letter-spacing="3" text-anchor="end">
    <text x="-20" y="3">PURPLE HOUR</text>
    <line x1="-14" y1="0" x2="0" y2="0" stroke="#a78bfa" stroke-width="0.6"/>
  </g>
</svg>