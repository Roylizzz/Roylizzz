<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Duvan Saldarriaga — Software Developer</title>
  <desc id="desc">Dark developer profile banner for Roylizzz</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 20) rotate(138) scale(430 300)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 330) rotate(-48) scale(430 280)">
      <stop stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#0D1117"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glowB)"/>

  <rect x="28" y="28" width="1144" height="264" rx="20" fill="#0B0F14" fill-opacity="0.78" stroke="#30363D" filter="url(#shadow)"/>

  <circle cx="54" cy="52" r="5" fill="#FF7B72"/>
  <circle cx="72" cy="52" r="5" fill="#D29922"/>
  <circle cx="90" cy="52" r="5" fill="#3FB950"/>
  <text x="112" y="57" fill="#7D8590" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.4">PROFILE / ROYLIZZZ</text>

  <text x="76" y="132" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1.2">DUVAN SALDARRIAGA</text>
  <rect x="76" y="151" width="530" height="4" rx="2" fill="url(#accent)"/>
  <text x="76" y="188" fill="#B7C0CC" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2.1">SOFTWARE DEVELOPER  ·  SYSTEMS  ·  AUTOMATION</text>
  <text x="76" y="226" fill="#7D8590" font-family="Consolas, Menlo, monospace" font-size="15">C# / .NET  ·  BLAZOR  ·  SQL  ·  APIS  ·  WEB &amp; DESKTOP</text>

  <g transform="translate(868 86)">
    <rect width="232" height="142" rx="18" fill="#10161F" stroke="#30363D"/>
    <text x="24" y="42" fill="#7D8590" font-family="Consolas, Menlo, monospace" font-size="14">duvan@dev:~$</text>
    <text x="24" y="72" fill="#58A6FF" font-family="Consolas, Menlo, monospace" font-size="14">build --useful</text>
    <text x="24" y="102" fill="#3FB950" font-family="Consolas, Menlo, monospace" font-size="14">✓ shipped</text>
    <text x="176" y="119" fill="url(#accent)" font-family="Consolas, Menlo, monospace" font-size="38" font-weight="700">&lt;/&gt;</text>
  </g>

  <rect x="76" y="250" width="116" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
  <circle cx="92" cy="264" r="5" fill="#3FB950"/>
  <text x="104" y="269" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">@Roylizzz</text>

  <path d="M1080 264h26" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1115 264h10" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
</svg>
