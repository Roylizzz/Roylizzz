<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Roylizzz — Duvan Saldarriaga</title>
  <desc id="desc">Anime-inspired cyber night banner with moon, skyline and neon accents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070713"/>
      <stop offset="0.52" stop-color="#11102A"/>
      <stop offset="1" stop-color="#090A16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5EFFF" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#D8C9FF" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#C4B5FD" stroke-opacity="0.035"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <!-- atmospheric glows -->
  <circle cx="1000" cy="70" r="190" fill="url(#moonGlow)" opacity="0.45"/>
  <circle cx="1030" cy="78" r="74" fill="#F3EEFF" opacity="0.92"/>
  <circle cx="1064" cy="52" r="72" fill="#101028"/>
  <ellipse cx="730" cy="330" rx="420" ry="100" fill="url(#pinkGlow)" filter="url(#blur)"/>

  <!-- stars -->
  <g fill="#EDE9FE" opacity="0.7">
    <circle cx="818" cy="55" r="1.4"/><circle cx="885" cy="105" r="1.2"/><circle cx="742" cy="87" r="1"/>
    <circle cx="1110" cy="150" r="1.2"/><circle cx="957" cy="150" r="1.1"/><circle cx="685" cy="43" r="1"/>
    <circle cx="1145" cy="61" r="1.1"/><circle cx="785" cy="141" r="1.3"/>
  </g>

  <!-- skyline -->
  <g opacity="0.92">
    <path d="M650 312v-88h38v88zm42 0v-128h54v128zm58 0v-76h38v76zm43 0v-152h62v152zm67 0v-110h45v110zm50 0v-184h58v184zm63 0v-126h43v126zm48 0v-84h36v84zm41 0v-146h51v146zm56 0v-102h48v102z" fill="#090B18"/>
    <g fill="#8B5CF6" opacity="0.38">
      <rect x="706" y="200" width="5" height="9"/><rect x="726" y="216" width="5" height="9"/>
      <rect x="813" y="180" width="6" height="10"/><rect x="837" y="201" width="6" height="10"/>
      <rect x="925" y="148" width="6" height="9"/><rect x="947" y="180" width="6" height="9"/>
      <rect x="1060" y="191" width="6" height="10"/><rect x="1082" y="221" width="6" height="10"/>
    </g>
    <g fill="#38BDF8" opacity="0.32">
      <rect x="702" y="239" width="5" height="9"/><rect x="824" y="236" width="6" height="10"/>
      <rect x="929" y="210" width="6" height="9"/><rect x="1090" y="253" width="6" height="9"/>
    </g>
  </g>

  <!-- torii-inspired line motif -->
  <g transform="translate(78 52)" opacity="0.82">
    <path d="M0 20h158M18 42h122M38 42v45M120 42v45" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 20c25 8 132 8 158 0" fill="none" stroke="#F0ABFC" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- main identity -->
  <text x="78" y="165" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5">ロイリズ • DEV MODE</text>
  <text x="78" y="220" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="800" letter-spacing="1">DUVAN SALDARRIAGA</text>
  <rect x="78" y="238" width="498" height="4" rx="2" fill="url(#neon)" filter="url(#softGlow)"/>
  <text x="78" y="274" fill="#C4B5FD" font-family="Consolas, Menlo, monospace" font-size="17">@Roylizzz  //  software developer</text>
  <text x="78" y="306" fill="#8B93A7" font-family="Consolas, Menlo, monospace" font-size="14">C# · .NET · BLAZOR · SQL · WEB · DESKTOP · AUTOMATION</text>

  <!-- anime-style petals -->
  <g fill="#F9A8D4" opacity="0.76">
    <path d="M620 76c16-12 23 8 8 16-8-4-12-9-8-16z"/>
    <path d="M572 118c13-10 20 7 7 13-7-3-10-7-7-13z" transform="rotate(18 579 124)"/>
    <path d="M1090 255c14-11 21 7 7 14-7-3-11-8-7-14z" transform="rotate(-24 1097 262)"/>
    <path d="M1005 282c11-9 18 6 6 12-6-3-9-7-6-12z" transform="rotate(28 1011 288)"/>
    <path d="M658 300c12-10 19 6 6 13-6-3-9-8-6-13z" transform="rotate(-18 664 306)"/>
  </g>

  <!-- corner signature -->
  <text x="1118" y="332" text-anchor="end" fill="#6B7280" font-family="Consolas, Menlo, monospace" font-size="12">CODE / 夜 / 進化</text>
</svg>