    <path d="M80 115c-2-54 25-91 67-94 45-2 77 34 78 91" fill="none" stroke="#2A2D49" stroke-width="10" stroke-linecap="round"/>
    <rect x="72" y="111" width="20" height="49" rx="9" fill="#24263E" stroke="#8B5CF6"/><rect x="208" y="109" width="20" height="51" rx="9" fill="#24263E" stroke="#38BDF8"/>
