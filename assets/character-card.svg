<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Roylizzz character card</title>
  <desc id="d">Original anime-inspired cyber developer character card</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0917"/><stop offset="1" stop-color="#12122B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6"/><stop offset="0.55" stop-color="#EC4899"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#A78BFA" stop-opacity=".34"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="358" rx="25" fill="none" stroke="#2B2A46"/>
  <circle cx="584" cy="153" r="170" fill="url(#glow)"/>
  <path d="M0 304C151 271 256 326 391 293c121-30 222-25 369 11v56H0z" fill="#0D0D20"/>
  <path d="M0 313C169 280 274 333 410 304c119-26 218-17 350 12" fill="none" stroke="url(#accent)" stroke-opacity=".28"/>

  <!-- left info -->
  <text x="42" y="58" fill="#A78BFA" font-family="Consolas, monospace" font-size="13" letter-spacing="3">PLAYER PROFILE // 01</text>
  <text x="42" y="108" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">ROYLIZZZ</text>
  <text x="42" y="137" fill="#8B93A7" font-family="Consolas, monospace" font-size="14">Duvan Saldarriaga</text>
  <rect x="42" y="159" width="255" height="2" fill="url(#accent)"/>
  <text x="42" y="196" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CLASS</text>
  <text x="122" y="196" fill="#E5E7EB" font-family="Consolas, monospace" font-size="14">Software Developer</text>
  <text x="42" y="226" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">TRAIT</text>
  <text x="122" y="226" fill="#E5E7EB" font-family="Consolas, monospace" font-size="14">Build · Refine · Repeat</text>
  <text x="42" y="256" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">MODE</text>
  <text x="122" y="256" fill="#E5E7EB" font-family="Consolas, monospace" font-size="14">夜 / night coding</text>
  <g transform="translate(42 286)">
    <rect width="82" height="27" rx="13.5" fill="#16152D" stroke="#37345D"/><circle cx="17" cy="13.5" r="4" fill="#4ADE80"/><text x="29" y="18" fill="#D1D5DB" font-family="Consolas, monospace" font-size="11">ONLINE</text>
    <rect x="92" width="110" height="27" rx="13.5" fill="#16152D" stroke="#37345D"/><text x="109" y="18" fill="#D1D5DB" font-family="Consolas, monospace" font-size="11">DEV MODE</text>
  </g>

  <!-- original anime-inspired character -->
