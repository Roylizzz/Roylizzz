name: metrics

# Rebuilds assets/stats-*.svg, assets/pulse-*.svg and assets/codetime-*.svg
# from the GitHub GraphQL API (and WakaTime, when the secret exists).
# No third-party card service is involved: the SVGs are drawn by tools/.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the data cards
        working-directory: tools
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          # Optional: a classic PAT with read:user also counts private contributions.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: turns the code time card into real numbers.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python build_stats.py

      - name: Commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/pulse-*.svg assets/codetime-*.svg
          if git diff --staged --quiet; then
            echo "nothing changed today"
          else
            git commit -m "chore: refresh profile metrics"
            git push
          fi
